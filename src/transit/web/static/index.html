<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UCLA Transit</title>
    <style>
      :root { color-scheme: dark; --bg:#111418; --card:#1a1f26; --line:#262d36; --dim:#8b95a3; --ok:#4ade80; --stale:#f59e0b; }
      * { box-sizing: border-box; }
      body { margin:0; background:var(--bg); color:#e7ecf2; font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      main { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .sub { color: var(--dim); font-size: 13px; margin-bottom: 18px; }
      .labels { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
      .labels button { background:var(--card); color:#e7ecf2; border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-size:14px; cursor:pointer; }
      .labels button[aria-pressed="true"] { background:#2563eb; border-color:#2563eb; }
      .stop { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
      .stop h2 { font-size:15px; margin:0 0 2px; }
      .stop .meta { color:var(--dim); font-size:12px; margin-bottom:10px; }
      table { width:100%; border-collapse:collapse; }
      td, th { text-align:left; padding:6px 4px; font-size:14px; border-bottom:1px solid var(--line); }
      th { color:var(--dim); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
      tr:last-child td { border-bottom:none; }
      .route { font-weight:600; }
      .eta { font-variant-numeric: tabular-nums; }
      .fresh { color:var(--ok); font-size:12px; }
      .old { color:var(--stale); font-size:12px; }
      .empty { color:var(--dim); font-size:13px; padding:6px 4px; }
      footer { color:var(--dim); font-size:12px; margin-top:20px; }
      a { color:#7aa2f7; }
    </style>
  </head>
  <body>
    <main>
      <h1>UCLA Transit</h1>
      <div class="sub">Big Blue Bus realtime arrivals &middot; <span id="health">checking…</span></div>
      <div class="labels" id="labels"></div>
      <div id="stops"></div>
      <footer>
        Auto-refreshes every 20s. Every row shows when the agency generated the prediction, not when this page loaded.
        <a href="/docs">API docs</a>
      </footer>
    </main>
    <script>
      const state = { favorites: [], label: null };

      const ago = (s) => s == null ? "no data" : s < 60 ? `${s}s ago` : `${Math.round(s / 60)}m ago`;

      async function loadFavorites() {
        state.favorites = await (await fetch("/favorites")).json();
        const labels = [...new Set(state.favorites.map((f) => f.label))];
        state.label = state.label && labels.includes(state.label) ? state.label : labels[0];
        document.getElementById("labels").innerHTML = labels
          .map((l) => `<button data-label="${l}" aria-pressed="${l === state.label}">${l}</button>`)
          .join("");
        document.querySelectorAll("#labels button").forEach((b) =>
          b.addEventListener("click", () => { state.label = b.dataset.label; loadFavorites(); render(); })
        );
      }

      async function loadHealth() {
        try {
          const h = await (await fetch("/health")).json();
          const feed = (h.feeds || []).find((f) => f.feed_kind === "trip_updates");
          document.getElementById("health").textContent =
            `${h.status} · feed ${ago(feed && feed.feed_age_seconds)} · ${h.prediction_count.toLocaleString()} predictions stored`;
        } catch (e) {
          document.getElementById("health").textContent = "API unreachable";
        }
      }

      function arrivalsTable(data) {
        if (!data.arrivals.length) return `<div class="empty">No realtime arrivals in the next 90 minutes.</div>`;
        return `<table><tr><th>Route</th><th>To</th><th>ETA</th><th>Freshness</th></tr>` +
          data.arrivals.map((a) => `<tr>
            <td class="route">${a.route_short_name || "?"}</td>
            <td>${a.headsign || ""}</td>
            <td class="eta">${a.eta_minutes === 0 ? "now" : a.eta_minutes + " min"}</td>
            <td class="${a.freshness.stale ? "old" : "fresh"}">${ago(a.freshness.age_seconds)}</td>
          </tr>`).join("") + `</table>`;
      }

      async function render() {
        const stops = state.favorites.filter((f) => f.label === state.label);
        const container = document.getElementById("stops");
        container.innerHTML = stops.map((s) => `<div class="stop" id="stop-${s.stop_id}">
            <h2>${s.stop_name}</h2>
            <div class="meta">stop ${s.stop_id}${s.walk_minutes ? ` · ${s.walk_minutes} min walk` : ""}</div>
            <div class="body"><div class="empty">loading…</div></div>
          </div>`).join("");
        await Promise.all(stops.map(async (s) => {
          const target = document.querySelector(`#stop-${CSS.escape(s.stop_id)} .body`);
          try {
            const data = await (await fetch(`/stops/${encodeURIComponent(s.stop_id)}/arrivals`)).json();
            target.innerHTML = arrivalsTable(data);
          } catch (e) {
            target.innerHTML = `<div class="empty">could not load arrivals</div>`;
          }
        }));
      }

      async function tick() { await loadHealth(); await render(); }
      loadFavorites().then(tick);
      setInterval(tick, 20000);
    </script>
  </body>
</html>
